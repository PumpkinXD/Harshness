<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .navbar {
            display: flex;
            padding: 8px;
            background: #f1f1f1;
            align-items: center;
        }
        .nav-button {
            margin-right: 5px;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 3px;
            background: white;
            cursor: pointer;
        }
        .nav-button:hover {
            background: #f5f5f5;
        }
        .nav-button i {
            font-size: 14px;
            color: #444;
        }
        .url-input-container {
            position: relative;
            flex-grow: 1;
            margin-right: 5px;
        }
        #urlbar {
            width: 100%;
            padding: 8px 8px 8px 30px;
            border: 1px solid #ddd;
            border-radius: 3px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .url-input-container i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            pointer-events: none;
            font-size: 14px;
        }
        #webview {
            width: 100%;
            height: calc(100vh - 45px);
            border: none;
        }
        .menu-button {
            margin-left: 5px;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 3px;
            background: white;
            cursor: pointer;
        }
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            border-radius: 3px;
        }
        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }
        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
    </style>
</head>
<body style="margin: 0;">
    <div class="navbar">
        <button class="nav-button" onclick="webview.goBack()"><i class="fas fa-chevron-left"></i></button>
        <button class="nav-button" onclick="webview.goForward()"><i class="fas fa-chevron-right"></i></button>
        <button class="nav-button" onclick="webview.reload()"><i class="fas fa-redo"></i></button>
        <div class="url-input-container">
            <i class="fas fa-globe"></i>
            <input type="text" id="urlbar" placeholder="URL...">
        </div>
        <div class="dropdown">
            <button class="menu-button"><i class="fa-solid fa-bars"></i></button>
            <div class="dropdown-content">
                <a href="#" onclick="webview.openDevTools()"><i class="fa-solid fa-toolbox"></i> DevTools</a>
            </div>
        </div>
    </div>
    <webview id="webview" src="https://discord.com/app"></webview>

    <script>
        const urlbar = document.getElementById('urlbar');
        const webview = document.getElementById('webview');

        // Set webview attributes
        webview.setAttribute('webpreferences', 'webSecurity=no');
        webview.setAttribute('allowpopups', '');
        webview.setAttribute('allowRunningInsecureContent', '');

        // Comment out auto DevTools opening
        // webview.addEventListener('dom-ready', () => {
        //     webview.openDevTools();
        // });

        // Navigate to new URL when Enter key is pressed
        urlbar.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                let url = urlbar.value;
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }
                webview.loadURL(url);
            }
        });

        // Update URL bar when webview navigates to new page
        webview.addEventListener('did-navigate', (e) => {
            urlbar.value = e.url;
        });

        // Update URL bar when in-page navigation occurs
        webview.addEventListener('did-navigate-in-page', (e) => {
            urlbar.value = e.url;
        });
    </script>
</body>
</html>
