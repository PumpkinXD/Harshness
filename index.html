<!DOCTYPE html>
<html>
<head>
    <style>
        #urlbar {
            width: 100%;
            padding: 5px;
            margin-bottom: 5px;
        }
        #webview {
            width: 100%;
            height: calc(100vh - 40px);
            border: none;
        }
    </style>
</head>
<body style="margin: 0;">
    <input type="text" id="urlbar" placeholder="输入网址...">
    <webview id="webview" src="https://discord.com/app"></webview>

    <script>
        const urlbar = document.getElementById('urlbar');
        const webview = document.getElementById('webview');

        // 设置 webview 的属性
        webview.setAttribute('webpreferences', 'webSecurity=no');
        webview.setAttribute('allowpopups', '');
        webview.setAttribute('allowRunningInsecureContent', '');

        webview.addEventListener('dom-ready', () => {
            webview.openDevTools();
        });

        // 当按下回车键时导航到新地址
        urlbar.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                let url = urlbar.value;
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }
                webview.loadURL(url);
            }
        });

        // 当webview导航到新页面时更新地址栏
        webview.addEventListener('did-navigate', (e) => {
            urlbar.value = e.url;
        });
    </script>
</body>
</html>
